# Aviso por Telegram de cada comentario nuevo del diario (ADR 0030 del repositorio diarioiaeducativa/periodico):
# a Juanjo de Haro y a Raül Torres, el mismo mensaje por el Bot de IA Educativa. A nadie se le avisa de lo suyo.
# Vive solo en este repositorio: la publicación diaria no toca .github/ (rsync --exclude .github).
# El programa, en .github/avisar-comentario.py; el texto del comentario no pasa nunca por la shell.
name: Aviso de comentario

on:
  discussion_comment:
    types: [created]

permissions:
  contents: read
  discussions: read   # para pedir a GitHub el comentario ya convertido a HTML

jobs:
  avisar:
    if: github.event.discussion.category.name == 'Comentarios'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Avisar por Telegram
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOT_IAEDUCATIVA_TOKEN: ${{ secrets.BOT_IAEDUCATIVA_TOKEN }}
          JUANJO_CHAT: ${{ secrets.JUANJO_CHAT }}
          RAUL_CHAT: ${{ secrets.RAUL_CHAT }}
        run: python3 .github/avisar-comentario.py
